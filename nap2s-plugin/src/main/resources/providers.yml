# Cau hinh nhieu cong nap cho Nap2S
#
# PHAN BIET QUAN TRONG:
#   Provider ID = ten ban tu dat (VD: provider-1, cardvip-main)
#                 -> dung cho lenh /nap2s setkey
#   Family      = chuan API ma cong do dung -> plugin tu xu ly
#
# Vi du lenh DUNG:  /nap2s setkey provider-1 partner-id xxx
# Vi du lenh SAI:   /nap2s setkey chargingws-v2 partner-id xxx
#                    (chargingws-v2 la family, khong phai ID cong)
#
# Goi y: dat ten de nho thay vi provider-1, vi du:
#   cardvip-main:
#   gachthe1s-backup:
#
# Family ho tro: chargingws-v2, gachthe1s, card2k, thesieure, cardvip

routing:
  mode: best-rate
  fallback-to-legacy: true
  default-provider: provider-1
  overrides:
    viettel: auto
    mobifone: auto
    vinaphone: auto
    vietnamobile: auto
    garena: auto
    zing: auto
    vcoin: auto
    gate: auto
    scoin: auto

